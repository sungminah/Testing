<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1b2b">
<title>Coral Crown N5</title>
<style>:root{--u:3px;--ink:#1d2433;--paper:#fffdf5;--acc:#2f9bd6;--ok:#2e9e5b;--bad:#d64545;--gold:#e0a82e;--padh:0px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b1b2b;color:#fff;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP","Noto Sans",sans-serif}
#app{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;gap:6px}
#screen{position:relative;width:min(100vw,calc((100dvh - var(--padh))*1.5));aspect-ratio:3/2;background:#000;overflow:hidden;border-radius:4px}
#cv,#cv2{position:absolute;inset:0;width:100%;height:100%}
#cv2{pointer-events:none}
#hud{position:absolute;inset:0;pointer-events:none;font-size:max(11px,calc(var(--u)*6))}
.hb{position:absolute;background:var(--paper);color:var(--ink);border:calc(var(--u)*1) solid var(--ink);border-radius:calc(var(--u)*3);padding:calc(var(--u)*2) calc(var(--u)*3);min-width:calc(var(--u)*78);line-height:1.15}
.hb b{font-size:max(12px,calc(var(--u)*6.4))}
.hb .lv{float:right;font-size:calc(var(--u)*5.6)}
.bar{height:calc(var(--u)*3);background:#cfd6df;border-radius:calc(var(--u)*2);overflow:hidden;margin-top:calc(var(--u)*1.5)}
.bar i{display:block;height:100%;background:var(--ok);transition:width .25s}
.bar.lo i{background:var(--gold)}.bar.cr i{background:var(--bad)}
.bar.xp{height:calc(var(--u)*2.4)}.bar.xp i{background:linear-gradient(90deg,#2f9bd6,#7fd6ff);transition:none}
.hb small{font-size:calc(var(--u)*5)}
#dlg,#bmenu{position:absolute;left:calc(var(--u)*4);right:calc(var(--u)*4);bottom:calc(var(--u)*4);background:var(--paper);color:var(--ink);border:calc(var(--u)*1.2) solid var(--ink);border-radius:calc(var(--u)*4);padding:calc(var(--u)*3.5) calc(var(--u)*5);font-size:max(12.5px,calc(var(--u)*7));line-height:1.35;min-height:calc(var(--u)*32);cursor:pointer;box-shadow:0 calc(var(--u)*1.5) 0 rgba(0,0,0,.35)}
#dlg[hidden],#bmenu[hidden],#modal[hidden]{display:none}
#dlg .nm{position:absolute;top:calc(var(--u)*-6);left:calc(var(--u)*4);background:var(--ink);color:#fff;border-radius:calc(var(--u)*2);padding:0 calc(var(--u)*3);font-size:calc(var(--u)*5.5)}
#dlg .jp{font-size:calc(var(--u)*8.5);font-weight:600}
#dlg .vi{opacity:.85}
#dlg .nx{position:absolute;right:calc(var(--u)*4);bottom:calc(var(--u)*1);animation:bl .8s infinite;font-size:calc(var(--u)*6)}
@keyframes bl{50%{opacity:.2}}
#bmenu{cursor:default;display:grid;grid-template-columns:repeat(2,1fr);gap:calc(var(--u)*2);padding:calc(var(--u)*3)}
#bmenu.col3{grid-template-columns:repeat(3,1fr)}
#bmenu .ti{grid-column:1/-1;font-size:calc(var(--u)*5.5);opacity:.75}
.mb{font:inherit;font-size:max(12px,calc(var(--u)*6.4));border:calc(var(--u)*.9) solid var(--ink);background:#fff;color:var(--ink);border-radius:calc(var(--u)*2.5);padding:calc(var(--u)*2.2) calc(var(--u)*2);cursor:pointer;text-align:left;line-height:1.15}
.mb:hover,.mb:focus{background:#dff1fb;outline:none}
.mb:disabled{opacity:.4;cursor:default}
.mb small{display:block;font-size:.75em;opacity:.7}
ruby rt{font-size:.5em;font-weight:400;opacity:.9}
ruby{ruby-position:over}
/* touch pad */
#pad{display:none;width:min(100vw,520px);padding:0 14px;justify-content:space-between;align-items:center}
@media (pointer:coarse),(max-width:760px){#pad{display:flex}}
#dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:4px;grid-template-areas:". u ." "l d r"}
#dpad button[data-k=u]{grid-area:u}#dpad button[data-k=l]{grid-area:l}#dpad button[data-k=d]{grid-area:d}#dpad button[data-k=r]{grid-area:r}
#abtns{display:flex;gap:10px;align-items:center}
#pad button{width:54px;height:54px;border-radius:50%;border:2px solid #5b7a96;background:#1c3550;color:#dfeaf5;font-size:18px;font-weight:700;touch-action:none}
#pad button:active{background:#2f6a9a}
#abtns button.sm{width:60px;height:36px;border-radius:18px;font-size:12px}
#abtns button[data-k=a]{background:#2e7d52;border-color:#7ed3a0;width:62px;height:62px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(5,15,28,.86);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:8px}
#modal .card{background:var(--paper);color:var(--ink);width:min(720px,100%);margin:auto;border-radius:16px;padding:14px 16px 16px;box-shadow:0 6px 30px rgba(0,0,0,.5);font-size:16px;line-height:1.5;-webkit-user-select:text;user-select:text}
#modal h2{margin:0 0 8px;font-size:18px}
#modal h3{margin:12px 0 4px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:#52627a}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;background:#e6eef7;color:#33465e;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:600}
.chip.t{background:#2f9bd6;color:#fff}.chip.d1{background:#cfeedd}.chip.d2{background:#fbe8b8}.chip.d3{background:#f7c5c5}
.q{font-size:22px;font-weight:600;line-height:1.7;margin:6px 0 10px}
.q.pass{font-size:19px;font-weight:500;background:#f1f5fa;border-radius:10px;padding:8px 12px;line-height:1.9}
.q .blank{display:inline-block;min-width:2.2em;border-bottom:2px solid var(--ink);text-align:center}
.choices{display:grid;gap:8px}
.ch{font:inherit;font-size:20px;line-height:1.7;text-align:left;border:2px solid #b9c7d8;background:#fff;color:var(--ink);border-radius:12px;padding:6px 12px;cursor:pointer;display:flex;gap:10px;align-items:center}
.ch:hover{border-color:var(--acc);background:#eef8fe}
.ch .n{flex:none;width:26px;height:26px;border-radius:50%;background:#e6eef7;font-size:14px;display:grid;place-items:center;font-weight:700}
.ch.ok{border-color:var(--ok);background:#e3f6ea}.ch.ng{border-color:var(--bad);background:#fde8e8}
.ch.dim{opacity:.55}
.timer{height:5px;background:#dfe7f0;border-radius:3px;overflow:hidden;margin:2px 0 8px}
.timer i{display:block;height:100%;background:var(--gold);width:100%}
.res{font-weight:800;font-size:20px;margin:0 0 4px}
.res.ok{color:var(--ok)}.res.ng{color:var(--bad)}
.box{background:#f1f5fa;border-radius:10px;padding:8px 12px;margin:4px 0}
.vi{color:#40526b}
.wl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:15px}
.wl b{font-weight:600}
.btn{font:inherit;font-size:16px;font-weight:700;background:var(--acc);color:#fff;border:0;border-radius:12px;padding:10px 18px;cursor:pointer}
.btn.g{background:#e6eef7;color:#33465e}
.btn:disabled{opacity:.4}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap;position:sticky;bottom:-16px;background:linear-gradient(to top,var(--paper) 75%,transparent);padding:10px 0 14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.tab{font:inherit;font-size:14px;font-weight:600;border:0;background:#e6eef7;color:#33465e;border-radius:99px;padding:6px 12px;cursor:pointer}
.tab.on{background:var(--ink);color:#fff}
.list{display:grid;gap:6px}
.item{display:flex;gap:10px;align-items:center;background:#f1f5fa;border-radius:12px;padding:6px 10px}
.item .grow{flex:1;min-width:0}
.item canvas{flex:none;width:52px;height:52px;background:#e3edf6;border-radius:10px}
.dexg{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.dc{background:#f1f5fa;border-radius:10px;text-align:center;font-size:10px;padding:4px 2px;position:relative}
.dc canvas{width:48px;height:48px}
.dc.ct::after{content:"✓";position:absolute;top:2px;right:5px;color:var(--ok);font-weight:800;font-size:12px}
.pgb{height:10px;background:#dfe7f0;border-radius:6px;overflow:hidden}.pgb i{display:block;height:100%;background:var(--acc)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:15px}
#sea{width:100%;height:auto;border-radius:12px;display:block;background:#2a79b0}
#sea .isl{cursor:pointer}
#sea text{font-family:inherit;pointer-events:none}
.heroes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.hero{font:inherit;background:#f1f5fa;border:3px solid #cdd8e6;border-radius:16px;padding:10px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--ink);text-align:center}
.hero:hover,.hero:focus{border-color:var(--acc);background:#eaf6fd;outline:none}
.hero canvas{width:96px;height:112px}
.hero b{font-size:20px}.hero small{font-size:13px;line-height:1.35;color:#40526b}
.title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*4);text-align:center}
.title h1{margin:0;font-size:calc(var(--u)*17);text-shadow:0 calc(var(--u)*1.5) 0 #0b3a5a;letter-spacing:.02em}
.title p{margin:0;font-size:calc(var(--u)*6.5);opacity:.92}
.title .mb{min-width:calc(var(--u)*80);text-align:center;font-size:calc(var(--u)*8)}

#modal button:focus-visible,#modal .ch:focus,.title .mb:focus{outline:3px solid #2f9bd6;outline-offset:2px}
#modal .ch:focus{background:#eef8fe;border-color:var(--acc)}
#sea g:focus{outline:none;filter:drop-shadow(0 0 4px #fff)}
</style>
</head>
<body>
<div id="app">
  <div id="screen">
    <canvas id="cv" width="240" height="160"></canvas>
    <canvas id="cv2" width="720" height="480"></canvas>
    <div id="hud"></div>
    <div id="dlg" hidden></div>
    <div id="bmenu" hidden></div>
  </div>
  <div id="pad">
    <div id="dpad">
      <button data-k="u" aria-label="lên">▲</button><button data-k="l" aria-label="trái">◀</button>
      <button data-k="r" aria-label="phải">▶</button><button data-k="d" aria-label="xuống">▼</button>
    </div>
    <div id="abtns">
      <button data-k="m" class="sm">MENU</button><button data-k="b">B</button><button data-k="a">A</button>
    </div>
  </div>
</div>
<div id="modal" hidden></div>
<script>/* ---- 00-core.js ---- */
'use strict';
/* ===== core: tiện ích, RNG, coroutine, input, âm thanh ===== */
const W = 240, H = 160, T = 16;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
let _rng = Math.random;
function seed(n) { let a = n >>> 0; _rng = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = () => _rng();
const ri = n => Math.floor(rand() * n);
const pick = a => a[ri(a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = ri(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function wpick(items, wf) {
  let tot = 0; const ws = items.map(x => { const w = Math.max(0, wf(x)); tot += w; return w; });
  if (tot <= 0) return pick(items);
  let r = rand() * tot;
  for (let i = 0; i < items.length; i++) { r -= ws[i]; if (r <= 0) return items[i]; }
  return items[items.length - 1];
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }

/* ---- coroutine: yield n = chờ n frame; yield fn = chờ tới khi fn() true; yield* gen ---- */
class Co {
  constructor(g) { this.it = g; this.w = 0; this.pred = null; this.done = false; }
  step() {
    if (this.done) return;
    if (this.w > 0) { this.w--; return; }
    if (this.pred) { if (!this.pred()) return; this.pred = null; }
    let r;
    try { r = this.it.next(); } catch (e) { this.done = true; (window.__errors = window.__errors || []).push(String(e && e.stack || e)); console.error(e); return; }
    if (r.done) { this.done = true; return; }
    const v = r.value;
    if (typeof v === 'number') this.w = v; else if (typeof v === 'function') this.pred = v;
  }
}
let script = null;
function run(genFn) { if (script && !script.done) return false; script = new Co(genFn()); return true; }
const busy = () => !!(script && !script.done);

/* ---- input ---- */
const Inp = { held: { u: 0, d: 0, l: 0, r: 0 }, a: 0, b: 0, m: 0 };
const KEYMAP = { ArrowUp: 'u', w: 'u', W: 'u', ArrowDown: 'd', s: 'd', S: 'd', ArrowLeft: 'l', a: 'l', A: 'l', ArrowRight: 'r', d: 'r', D: 'r' };
const Modal = { open: false, onKey: null };
function pressKey(k, down) {
  if (k === 'u' || k === 'd' || k === 'l' || k === 'r') Inp.held[k] = down ? 1 : 0;
  else if (down) { if (k === 'a') Inp.a = 1; else if (k === 'b') Inp.b = 1; else if (k === 'm') Inp.m = 1; }
}
/* điều hướng bằng phím trong menu/câu hỏi/tiêu đề: ↑← = trước, ↓→ = sau, Enter/Space/Z = chọn */
function navKeys(items, e) {
  if (!items.length) return false;
  const i = items.indexOf(document.activeElement), k = e.key;
  if (k === 'ArrowDown' || k === 'ArrowRight' || k === 's' || k === 'd') { items[(i + 1) % items.length].focus({ preventScroll: false }); return true; }
  if (k === 'ArrowUp' || k === 'ArrowLeft' || k === 'w' || k === 'a') { items[(i <= 0 ? items.length : i) - 1].focus(); return true; }
  if ((k === 'Enter' || k === ' ' || k === 'z') && i >= 0) { items[i].dispatchEvent(new MouseEvent('click', { bubbles: true })); return true; }
  return false;
}
const modalItems = () => $$('#modal button:not(:disabled), #modal [tabindex="0"]');
function focusFirst(items) { if (items[0]) items[0].focus({ preventScroll: true }); }
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (Modal.open) { if ((Modal.onKey && Modal.onKey(e)) || navKeys(modalItems(), e)) e.preventDefault(); return; }
  if (typeof Wd !== 'undefined' && Wd.mode === 'title') { if (navKeys($$('#screen .title button'), e)) e.preventDefault(); return; }
  if (KEYMAP[e.key]) { pressKey(KEYMAP[e.key], 1); e.preventDefault(); return; }
  if (e.key === 'z' || e.key === 'Z' || e.key === 'Enter' || e.key === ' ') { pressKey('a', 1); e.preventDefault(); }
  else if (e.key === 'x' || e.key === 'X' || e.key === 'Escape' || e.key === 'Backspace') { pressKey('b', 1); e.preventDefault(); }
  else if (e.key === 'm' || e.key === 'M') { pressKey('m', 1); e.preventDefault(); }
});
document.addEventListener('keyup', e => { if (KEYMAP[e.key]) pressKey(KEYMAP[e.key], 0); });
window.addEventListener('blur', () => { for (const k in Inp.held) Inp.held[k] = 0; });
$$('#pad button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); pressKey(k, 1); });
  const up = () => pressKey(k, 0);
  b.addEventListener('pointerup', up); b.addEventListener('pointerleave', up); b.addEventListener('pointercancel', up);
});

/* ---- âm thanh (WebAudio, rất nhẹ) ---- */
const Snd = {
  on: true, ac: null,
  tone(f, d = .08, type = 'square', v = .04, when = 0) {
    if (!this.on) return;
    try {
      if (!this.ac) this.ac = new (window.AudioContext || window.webkitAudioContext)();
      const ac = this.ac, o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + when;
      o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
      o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + d + .02);
    } catch (e) { /* không có audio */ }
  },
  ok() { this.tone(660, .09); this.tone(880, .12, 'square', .04, .09); },
  ng() { this.tone(180, .22, 'sawtooth', .05); },
  hit() { this.tone(120, .1, 'square', .06); },
  lvl() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, .12, 'square', .04, i * .09)); },
  tap() { this.tone(440, .03, 'square', .02); }
};

/* ---- nhạc nền chiptune tạo bằng WebAudio (vòng lặp ngắn; tắt được trong Cài đặt) ---- */
const MUS = {
  world: { bpm: 92, mel: [0, 2, 4, 2, 5, 4, 2, 0, 2, 4, 5, 7, 5, 4, 2, -1], bass: [0, 0, 3, 3, 4, 4, 3, 3], scale: [262, 294, 330, 392, 440, 523, 587, 659, 784, 880], wave: 'triangle' },
  battle: { bpm: 150, mel: [0, 3, 5, 3, 0, 3, 6, 3, 0, 3, 5, 7, 6, 5, 3, -1], bass: [0, 0, 0, 0, 2, 2, 3, 3], scale: [220, 262, 294, 330, 392, 440, 523, 587, 659, 784], wave: 'square' }
};
Snd.musicOn = true; Snd.want = 'world'; Snd.unlocked = false; Snd._m = { step: 0, next: 0, timer: null, mode: null };
Snd.stopMusic = function () { if (this._m.timer) { clearInterval(this._m.timer); this._m.timer = null; } this._m.mode = null; };
Snd.music = function (mode) {
  if (mode) this.want = mode;
  if (!this.unlocked || !this.on || !this.musicOn) { this.stopMusic(); return; }
  try {
    if (!this.ac) this.ac = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ac.state === 'suspended') this.ac.resume();
    if (this._m.mode === this.want && this._m.timer) return;
    this._m.mode = this.want; this._m.step = 0; this._m.next = this.ac.currentTime + .1;
    if (!this._m.timer) this._m.timer = setInterval(() => this._tick(), 100);
  } catch (e) { /* không có audio */ }
};
Snd._note = function (f, t, d, type, v) {
  try { const ac = this.ac, o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .02); } catch (e) { /* bỏ qua */ }
};
Snd._tick = function () {
  const m = this._m, P = MUS[m.mode]; if (!P || !this.ac) return;
  const dt = 60 / P.bpm / 2;
  while (m.next < this.ac.currentTime + .35) {
    const s = m.step % 16, note = P.mel[s];
    if (note >= 0) this._note(P.scale[note], m.next, dt * .9, P.wave, .02);
    if (s % 2 === 0) this._note(P.scale[P.bass[(m.step >> 1) % P.bass.length]] / 2, m.next, dt * 1.8, 'square', .01);
    m.next += dt; m.step++;
  }
};
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => { if (!Snd.unlocked) { Snd.unlocked = true; Snd.music(); } }, { passive: true }));

/* ---- 05-chapters.js ---- */
'use strict';
/* ===== 8 chương = 8 đảo của quần đảo "Coral Crown" (Vương Miện San Hô) ===== */
const CH = [
  { id: 'hajime', name: 'Hajime-jima', vi: 'Đảo Khởi Hành', lessons: [0, 0], topic: 'Romaji, hiragana, katakana và chữ Hán đơn giản',
    boss: { name: 'Cô Kana', hair: '#e08a3a', body: '#f0c040' },
    pal: { g1: '#7fd36a', g2: '#5cb85a', path: '#ecd9a2', roof: '#e0703a', wall: '#fbf0d6', tree: '#2f9a52', water: ['#45a5de', '#62bff0'] },
    phrases: [['ありがとう。 (arigatou)', 'Cảm ơn.'], ['おはよう。 (ohayou)', 'Chào buổi sáng.'], ['さようなら。 (sayounara)', 'Tạm biệt.']] },
  { id: 'asahi', name: 'Asahi-jima', vi: 'Đảo Bình Minh', lessons: [1, 3], topic: 'Chào hỏi, giới thiệu, これ/それ/あれ, số, tiền, giờ',

function align(w, r) {
  const segs = []; let i = 0;
  while (i < w.length) { let j = i; const k = isKanji(w[i]); while (j < w.length && isKanji(w[j]) === k) j++; segs.push({ k, s: w.slice(i, j) }); i = j; }
  let pos = 0;
  for (let n = 0; n < segs.length; n++) {
    const sg = segs[n];
    if (!sg.k) { if (r.substr(pos, sg.s.length) !== sg.s) return null; pos += sg.s.length; continue; }
    const nx = segs[n + 1];
    let end;
    if (!nx) end = r.length;
    else { end = r.indexOf(nx.s, pos + 1); if (end < 0) return null; }
    sg.r = r.slice(pos, end); pos = end;
    if (!sg.r) return null;
  }
  return segs;
}

function numRead(n, wrongAt) { // wrongAt: 't' | 'h' | null -> thay 1 phần bằng cách đọc sai

  const chars = [...r], outs = new Set();
  for (let i = 0; i < chars.length; i++) {

const SAVE_KEY = 'coral_crown_n5_v1';
let S = null;
let FRAME = 0;
function newState() {
  return {
    v: 1, hero: 0, cur: 0, maxCh: 0, map: 'i0_town', x: 9, y: 11, dir: 'u',
    party: [], box: [], bag: { net: 5, fruit: 3, snet: 0 }, pearls: 100,
    seen: {}, caught: {}, flags: {}, items: {}, leit: {}, pend: [], qCount: 0, recent: [], streak: 0,
    stats: { n: 0, ok: 0, by: {} }, sc: {}, opt: { sound: 1, furi: 'auto' }, defeated: {}, taken: {}, steps: 0, badges: []
  };
}
