name: CI
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build + kiểm thử (dữ liệu, bot tự chơi chương 1, hải đồ, lưu/tải, giao diện điện thoại)
        run: npm test
      - name: Kiểm tra docs/index.html đã được build mới nhất
        run: git diff --exit-code docs/index.html
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: test/out }
